apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-rust-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-rust
  template:
    metadata:
      labels:
        app: api-rust
    spec:
      containers:
      - name: api-rust
        image: us-central1-docker.pkg.dev/mimetic-pursuit-493618-h1/repo-rust/api-rust:v2
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-rust-service
spec:
  type: LoadBalancer
  selector:
    app: api-rust
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080