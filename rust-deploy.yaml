apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-rust-deployment
  labels:
    app: api-rust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-rust
  template:
    metadata:
      labels:
        app: api-rust
    spec:
      containers:
      - name: api-rust
        image: us-central1-docker.pkg.dev/mimetic-pursuit-493618-h1/repo-p3/api-rust:v1
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-rust-service
spec:
  selector:
    app: api-rust
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer

