apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-go-deployment
  labels:
    app: api-go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-go
  template:
    metadata:
      labels:
        app: api-go
    spec:
      containers:
      - name: api-go
        image: us-central1-docker.pkg.dev/mimetic-pursuit-493618-h1/repo-p3/api-go:v1
        ports:
        - containerPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: api-go-service
spec:
  selector:
    app: api-go
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051
  type: ClusterIP

